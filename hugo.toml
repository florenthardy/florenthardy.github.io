baseURL = "https://florenthardy.github.io"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableEmoji = true
enableRobotsTXT = true
pygmentsStyle = "monokai"
theme = "gokarna"

[params]
  avatarAltText = "avatar"
  avatarSize = "size-m"
  avatarURL = "/images/HARDY_Florent_11.jpg"

  customHeadHTML = """
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" integrity="sha384-Xi8rHCmBmhbuyyhbI88391ZKP2dmfnOl4rT9ZfRI7mLTdk1wblIUnrIq35nqwEvC" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js" integrity="sha384-X/XCfMm41VSsqRNQgDerQczD69XqmjOOOwYQvr/uuC+j4OPoNhVgjdGFwhvN02Ja" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js" integrity="sha384-+XBljXPPiv+OzfbB3cVmLHf4hdUFHlWNZN5spNQ7rmHTXpd7WvJum6fIACpNNfIR" crossorigin="anonymous"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
          ],
          throwOnError : false
        });
      });
    </script>
  """

  footer = "Florent Hardy"
  metaKeywords = ["portfolio", "cv", "étudiant"]
  showBackToTopButton = true

  socialIcons = [
    {name = "linkedin", url = "https://www.linkedin.com/in/florent-hardy-510bb3165/"},
    {name = "github", url = "https://github.com/florenthardy"},
    {name = "email", url = "mailto:florent.hardy@unistra.com"}
  ]

  showPostsOnHomePage = "recent"
  numberPostsOnHomePage = 3

[languages]
  [languages.fr]
    languageName = "Français"
    languageCode = "fr"
    weight = 1
    title = "Florent Hardy"
    [languages.fr.params]
      description = "Doctorant en informatique : Systèmes et Réseaux"
    [[languages.fr.menu.main]]
      name = "Accueil"
      pre = "<span data-feather='home'></span>"
      url = "/fr/"
      weight = 1
    [[languages.fr.menu.main]]
      name = "Projets"
      pre = "<span data-feather='code'></span>"
      url = "/fr/posts/"
      weight = 2
    [[languages.fr.menu.main]]
      name = "Tags"
      pre = "<span data-feather='tag'></span>"
      url = "/fr/tags/"
      weight = 3
    [[languages.fr.menu.main]]
      name = "GitHub"
      identifier = "github"
      pre = "<span data-feather='github'></span>"
      url = "https://github.com/florenthardy"
      weight = 4

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "Florent Hardy"
    [languages.en.params]
      description = "Ph.D student in Computer Science: Systems and Networks"
    [[languages.en.menu.main]]
      name = "Home"
      pre = "<span data-feather='home'></span>"
      url = "/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Projects"
      pre = "<span data-feather='code'></span>"
      url = "/posts/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Tags"
      pre = "<span data-feather='tag'></span>"
      url = "/tags/"
      weight = 3
    [[languages.en.menu.main]]
      name = "GitHub"
      identifier = "github"
      pre = "<span data-feather='github'></span>"
      url = "https://github.com/florenthardy"
      weight = 4

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  minifyOutput = true